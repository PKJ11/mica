<!DOCTYPE html>
<html lang="en-IN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Seeing Data Clearly · Data Visualisation</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Spectral:ital,wght@0,500;0,600;0,700;1,500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js"></script>
<style>
:root{
  --paper:#F2F4F6;--surface:#FFFFFF;--surface-2:#F7F9FA;--ink:#17202A;--ink-2:#44505C;--ink-3:#737F8B;
  --rule:#D2D9E0;--grid:#E6EBEF;--blue:#1F4E9E;--blue-soft:#E3EBF7;--on-blue:#FFFFFF;
  --red:#C13B47;--red-soft:#F8E4E6;--green:#23764A;--green-soft:#E1F0E7;--amber:#A5670F;--amber-soft:#F6EDDC;
  --muted:#BCC5CE;--c1:#3366B0;--c2:#E0892B;--c3:#2A9A80;--c4:#C44E6A;--c5:#8663B6;--c6:#8B7B5E;--c7:#5AA0D8;--c8:#6B7A3A;
  --serif:'Spectral',Georgia,'Times New Roman',serif;--sans:'Public Sans',system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#10171F;--surface:#17212B;--surface-2:#1C2733;--ink:#E4E9EE;--ink-2:#B2BDC8;--ink-3:#85919E;
    --rule:#2D3A48;--grid:#223040;--blue:#86ABEA;--blue-soft:#1C2C45;--on-blue:#0F1824;
    --red:#EE7A83;--red-soft:#3B2025;--green:#72C694;--green-soft:#1A3326;--amber:#E0A54B;--amber-soft:#382B16;
    --muted:#4A5868;--c1:#6F9BE0;--c2:#F0A456;--c3:#4FC0A4;--c4:#E57A93;--c5:#AE8FDB;--c6:#B8A688;--c7:#8CC4EE;--c8:#A6B868;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#10171F;--surface:#17212B;--surface-2:#1C2733;--ink:#E4E9EE;--ink-2:#B2BDC8;--ink-3:#85919E;
  --rule:#2D3A48;--grid:#223040;--blue:#86ABEA;--blue-soft:#1C2C45;--on-blue:#0F1824;
  --red:#EE7A83;--red-soft:#3B2025;--green:#72C694;--green-soft:#1A3326;--amber:#E0A54B;--amber-soft:#382B16;
  --muted:#4A5868;--c1:#6F9BE0;--c2:#F0A456;--c3:#4FC0A4;--c4:#E57A93;--c5:#AE8FDB;--c6:#B8A688;--c7:#8CC4EE;--c8:#A6B868;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{margin:0;height:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:16.5px;line-height:1.62;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
a{color:var(--blue)}
:focus-visible{outline:2.5px solid var(--blue);outline-offset:2px;border-radius:4px}
.num,table,.kpi-val{font-variant-numeric:tabular-nums}

/* ---------- layout ---------- */
.app{display:grid;grid-template-columns:288px minmax(0,1fr);min-height:100%}
.side{position:sticky;top:0;height:100vh;overflow-y:auto;background:var(--surface);border-right:1.5px solid var(--rule);padding:26px 18px 30px;display:flex;flex-direction:column}
.brand{font-family:var(--serif);font-weight:700;font-size:1.45rem;line-height:1.1;margin:0 0 4px;letter-spacing:-.01em}
.brand-sub{font-size:.84rem;color:var(--ink-3);margin:0 0 22px}
.toc{list-style:none;margin:0;padding:0;counter-reset:none}
.toc li{margin:0}
.toc button{display:grid;grid-template-columns:28px 1fr 14px;gap:6px;align-items:start;width:100%;text-align:left;background:none;border:0;border-radius:6px;padding:7px 8px;cursor:pointer;color:var(--ink-2);line-height:1.3;font-size:.93rem}
.toc button:hover{background:var(--surface-2);color:var(--ink)}
.toc button[aria-current="page"]{background:var(--blue-soft);color:var(--ink)}
.toc .n{font-family:var(--serif);font-weight:600;color:var(--ink-3);font-size:1rem}
.toc button[aria-current="page"] .n{color:var(--blue)}
.toc .st{width:10px;height:10px;border-radius:50%;border:1.5px solid var(--rule);margin-top:4px}
.toc .st.done{background:var(--green);border-color:var(--green)}
.toc .st.seen{border-color:var(--blue)}
.toc-sep{border:0;border-top:1.5px solid var(--rule);margin:12px 6px}
.side-foot{margin-top:auto;padding-top:20px;display:flex;flex-direction:column;gap:10px;font-size:.85rem;color:var(--ink-3)}
.progress-bar{height:6px;background:var(--grid);border-radius:3px;overflow:hidden}
.progress-bar span{display:block;height:100%;background:var(--green);width:0;transition:width .4s}
.topbar{display:none}
main{min-width:0}
.page{max-width:1000px;margin:0 auto;padding:44px 32px 90px}
.page p,.page li{max-width:70ch}
.page .fig p,.page .box p,.page .fig li,.page .box li{max-width:none}

/* ---------- type ---------- */
.cover{padding:6px 0 30px;margin-bottom:30px;border-bottom:1.5px solid var(--rule)}
.cover .kicker{color:var(--ink-3);font-size:.95rem;margin:0 0 6px}
.cover .title{font-family:var(--serif);font-size:clamp(2.4rem,5.5vw,3.7rem);font-weight:700;line-height:1.02;letter-spacing:-.02em;margin:0 0 14px}
.cover .title span{display:block;font-weight:500;font-style:italic;font-size:.5em;letter-spacing:0;color:var(--ink-2);margin-top:8px}
.ch-num{color:var(--blue);font-weight:600;font-size:.95rem;margin:0 0 4px}
h1{font-family:var(--serif);font-weight:600;font-size:clamp(1.9rem,4vw,2.55rem);line-height:1.12;letter-spacing:-.015em;margin:0 0 14px}
h2{font-family:var(--serif);font-weight:600;font-size:1.6rem;line-height:1.2;margin:48px 0 12px;letter-spacing:-.01em}
h3{font-size:1.07rem;font-weight:700;margin:28px 0 8px;line-height:1.35}
h4{font-size:.98rem;font-weight:700;margin:0 0 6px}
.lede{font-size:1.12rem;color:var(--ink-2);line-height:1.6}
.small{font-size:.86rem;color:var(--ink-3)}
.muted{color:var(--ink-3)}
.part{font-family:var(--serif);font-style:italic;color:var(--ink-3);font-size:1.05rem;margin:52px 0 -30px}

/* ---------- boxes & figures ---------- */
.box{border:1.5px solid var(--rule);border-radius:8px;padding:16px 20px;background:var(--surface);margin:20px 0}
.box.key{border-color:var(--blue)}
.box.warn{border-color:var(--red)}
.box.good{border-color:var(--green)}
.box.amber{border-color:var(--amber)}
.box > :first-child{margin-top:0}.box > :last-child{margin-bottom:0}
.box h4{font-size:1rem}
.fig{border:1.5px solid var(--rule);border-radius:8px;background:var(--surface);padding:18px;margin:22px 0}
.fig-title{font-weight:700;margin:0 0 4px;font-size:1rem}
.fig-note{font-size:.84rem;color:var(--ink-3);margin:10px 0 0}
.controls{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;margin:4px 0 12px}
.controls label{font-size:.9rem;color:var(--ink-2);display:inline-flex;gap:6px;align-items:center}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.stack > * + *{margin-top:12px}
.hidden{display:none !important}
.reveal{animation:rv .45s ease-out}
@keyframes rv{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion: reduce){*{animation:none !important;transition:none !important}}

/* ---------- controls ---------- */
.btn{border:1.5px solid var(--ink-2);background:var(--surface);color:var(--ink);border-radius:6px;padding:.45em 1em;font-weight:600;cursor:pointer;font-size:.93rem;line-height:1.3}
.btn:hover{border-color:var(--ink);background:var(--surface-2)}
.btn.primary{background:var(--blue);border-color:var(--blue);color:var(--on-blue)}
.btn.primary:hover{filter:brightness(1.08)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.sm{padding:.3em .75em;font-size:.86rem}
.chip{border:1.5px solid var(--rule);background:var(--surface);border-radius:999px;padding:.22em .8em;font-size:.86rem;cursor:pointer;color:var(--ink-2);line-height:1.4}
.chip:hover{border-color:var(--ink-3)}
.chip.on{border-color:var(--blue);background:var(--blue-soft);color:var(--ink);font-weight:600}
.chip .dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px;vertical-align:0}
.seg{display:inline-flex;border:1.5px solid var(--rule);border-radius:7px;overflow:hidden}
.seg button{border:0;background:var(--surface);padding:.3em .85em;font-size:.86rem;cursor:pointer;color:var(--ink-2);border-right:1.5px solid var(--rule)}
.seg button:last-child{border-right:0}
.seg button.on{background:var(--blue);color:var(--on-blue);font-weight:600}
input[type=range]{accent-color:var(--blue);width:220px;max-width:100%}
select{border:1.5px solid var(--rule);background:var(--surface);border-radius:6px;padding:.25em .5em}
input[type=number]{border:1.5px solid var(--rule);background:var(--surface);border-radius:6px;padding:.3em .5em;width:90px}
.val{font-weight:700;color:var(--ink);min-width:3ch;display:inline-block}

/* ---------- tables ---------- */
table.data{border-collapse:collapse;width:100%;font-size:.9rem}
table.data th,table.data td{padding:5px 8px;border-bottom:1px solid var(--grid);text-align:right}
table.data th{font-weight:700;color:var(--ink-2);border-bottom:1.5px solid var(--rule)}
table.data th:first-child,table.data td:first-child{text-align:left}
table.data tfoot td{border-top:1.5px solid var(--rule);font-weight:600;color:var(--ink)}
table.plain{border-collapse:collapse;width:100%;font-size:.93rem}
table.plain th,table.plain td{padding:9px 10px;border-bottom:1px solid var(--grid);text-align:left;vertical-align:top}
table.plain th{border-bottom:1.5px solid var(--rule);color:var(--ink-2)}
.scroll-x{overflow-x:auto}

/* ---------- charts ---------- */
svg.chart{width:100%;height:auto;display:block;overflow:visible}
svg text{font-family:var(--sans);fill:var(--ink-2);font-size:12px}
svg .axis path,svg .axis line{stroke:var(--rule)}
svg .axis text{fill:var(--ink-3);font-size:11.5px}
svg .gridl line{stroke:var(--grid)}
svg .gridl path{display:none}
svg .lbl-strong{fill:var(--ink);font-weight:600}
.tip{position:fixed;z-index:50;pointer-events:none;background:var(--ink);color:var(--paper);padding:7px 10px;border-radius:6px;font-size:.83rem;line-height:1.4;opacity:0;transition:opacity .12s;max-width:260px}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:.84rem;color:var(--ink-2);margin-top:8px}
.legend i{display:inline-block;width:11px;height:11px;border-radius:2px;margin-right:5px;vertical-align:-1px}

/* ---------- MCQ ---------- */
.mcq{border:1.5px solid var(--rule);border-radius:8px;padding:16px 18px;background:var(--surface);margin:14px 0}
.mcq .q{font-weight:600;margin:0 0 8px}
.opt{display:flex;gap:10px;width:100%;text-align:left;border:1.5px solid var(--rule);border-radius:7px;padding:.6em .85em;margin:7px 0;background:var(--surface);cursor:pointer;line-height:1.45;font-size:.95rem}
.opt:hover:not(:disabled){border-color:var(--ink-3);background:var(--surface-2)}
.opt .k{font-weight:700;color:var(--ink-3);min-width:1.2em}
.opt.correct{border-color:var(--green);background:var(--green-soft)}
.opt.wrong{border-color:var(--red);background:var(--red-soft)}
.opt:disabled{cursor:default}
.exp{margin-top:10px;padding:10px 14px;border-radius:7px;border:1.5px solid var(--rule);font-size:.93rem;background:var(--surface-2)}
.exp.ok{border-color:var(--green)}.exp.no{border-color:var(--red)}
.qc-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-top:56px}
.qc-head h2{margin:0}

/* ---------- chapter nav ---------- */
.pager{display:flex;justify-content:space-between;gap:12px;margin-top:56px;padding-top:24px;border-top:1.5px solid var(--rule)}
.pager button{max-width:48%}

/* ---------- misc components ---------- */
.kpi{border:1.5px solid var(--rule);border-radius:8px;padding:12px 14px;background:var(--surface)}
.kpi .lab{font-size:.83rem;color:var(--ink-3)}
.kpi .kpi-val{font-size:1.55rem;font-weight:700;line-height:1.2;color:var(--ink)}
.kpi .delta{font-size:.83rem;font-weight:600}
.up{color:var(--green)}.down{color:var(--red)}
.pill{display:inline-block;border:1.5px solid var(--rule);border-radius:999px;padding:0 .6em;font-size:.78rem;color:var(--ink-2)}
.crumbs{display:flex;flex-wrap:wrap;gap:4px;align-items:center;font-size:.88rem}
.crumbs button{border:0;background:none;color:var(--blue);cursor:pointer;padding:2px 4px;border-radius:4px;font-weight:600}
.crumbs button:hover{background:var(--blue-soft)}
.crumbs span.cur{font-weight:700;color:var(--ink);padding:2px 4px}
.crumbs .sep{color:var(--ink-3)}
.digits{font-family:var(--sans);font-variant-numeric:tabular-nums;font-size:1.25rem;letter-spacing:.32em;line-height:1.7;word-break:break-all;user-select:none;padding:10px 12px;border:1.5px solid var(--rule);border-radius:8px;background:var(--surface-2)}
.digits b{font-weight:400;color:var(--red)}
.timer{font-variant-numeric:tabular-nums;font-weight:700;font-size:1.1rem}
.ladder{list-style:none;padding:0;margin:0}
.ladder li{display:grid;grid-template-columns:34px 1fr auto;gap:10px;align-items:center;padding:7px 0;border-bottom:1px solid var(--grid)}
.ladder .rk{font-family:var(--serif);font-weight:700;color:var(--blue);font-size:1.1rem}
.cardgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px;margin-top:16px}
.vcard{border:1.5px solid var(--rule);border-radius:8px;background:var(--surface);padding:14px 16px;display:flex;flex-direction:column}
.vcard h3{margin:0 0 2px;font-size:1.05rem}
.vcard .fam{font-size:.8rem;color:var(--ink-3);margin-bottom:8px}
.vcard .viz{min-height:170px}
.vcard .uw{display:grid;grid-template-columns:1fr 1fr;gap:10px;font-size:.84rem;margin-top:10px;border-top:1px solid var(--grid);padding-top:10px}
.vcard .uw b{display:block;font-size:.8rem;margin-bottom:2px}
.vcard .uw .u b{color:var(--green)}.vcard .uw .a b{color:var(--red)}
.vcard .controls{margin:6px 0 6px;align-self:flex-start;max-width:100%}
.vcard input[type=range]{width:120px}
.seg{width:fit-content;max-width:100%}
.tabs{display:flex;gap:4px;flex-wrap:wrap;border-bottom:1.5px solid var(--rule);margin:18px 0 0}
.tabs button{border:1.5px solid transparent;border-bottom:0;background:none;padding:.5em 1em;cursor:pointer;border-radius:7px 7px 0 0;color:var(--ink-2);font-weight:600;font-size:.92rem;margin-bottom:-1.5px}
.tabs button.on{border-color:var(--rule);background:var(--surface);color:var(--ink);border-bottom:1.5px solid var(--surface)}
.tabpanel{border:1.5px solid var(--rule);border-top:0;border-radius:0 0 8px 8px;background:var(--surface);padding:18px}
.hot{cursor:pointer}
.hot circle{fill:var(--blue);stroke:var(--surface);stroke-width:2}
.hot text{fill:var(--on-blue);font-weight:700;font-size:12px;text-anchor:middle;pointer-events:none}
.hot.on circle{fill:var(--red)}
.wf-note{border:1.5px solid var(--rule);border-radius:8px;padding:12px 14px;background:var(--surface-2);min-height:90px}
.ex-grid{display:grid;grid-template-columns:minmax(0,1fr) 230px;gap:16px;align-items:start}
.board{position:relative;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));grid-auto-rows:minmax(128px,auto);gap:14px;padding:14px;border:1.5px solid var(--rule);border-radius:8px;background:var(--surface-2)}
.slot{position:relative;z-index:1;border:2px dashed var(--muted);border-radius:8px;background:var(--surface);padding:10px 12px;cursor:pointer;display:flex;flex-direction:column;gap:6px;transition:border-color .15s}
.slot:hover{border-color:var(--ink-3)}
.slot.sel{border-color:var(--blue);border-style:solid;box-shadow:0 0 0 3px var(--blue-soft)}
.slot.filled{border-style:solid;border-color:var(--rule)}
.slot.src{border-color:var(--amber);border-style:solid;box-shadow:0 0 0 3px var(--amber-soft)}
.slot .sid{font-family:var(--serif);font-weight:700;color:var(--blue);font-size:1.05rem;line-height:1}
.slot .brief{font-size:.84rem;color:var(--ink-2);line-height:1.4}
.slot .ass{display:flex;align-items:center;gap:8px;font-weight:600;font-size:.9rem;margin-top:auto}
.slot .fb{font-size:.8rem;line-height:1.35;border-radius:5px;padding:4px 7px}
.slot .fb.best{background:var(--green-soft);color:var(--green)}
.slot .fb.ok{background:var(--amber-soft);color:var(--amber)}
.slot .fb.bad{background:var(--red-soft);color:var(--red)}
.board svg.links{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:2;overflow:visible}
.palette{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.palette button{display:flex;flex-direction:column;align-items:center;gap:3px;border:1.5px solid var(--rule);background:var(--surface);border-radius:7px;padding:7px 4px;cursor:pointer;font-size:.76rem;line-height:1.2;color:var(--ink-2)}
.palette button:hover{border-color:var(--blue)}
.palette button:disabled{opacity:.4;cursor:not-allowed}
.icon svg{display:block}
.conn-list{list-style:none;padding:0;margin:8px 0 0;font-size:.86rem}
.conn-list li{display:flex;justify-content:space-between;align-items:center;gap:6px;padding:5px 0;border-bottom:1px solid var(--grid)}
.conn-list button{border:0;background:none;color:var(--red);cursor:pointer;font-weight:700}
.score{font-family:var(--serif);font-size:2.4rem;font-weight:700;line-height:1}
.qprog{height:6px;background:var(--grid);border-radius:3px;overflow:hidden;margin:8px 0 18px}
.qprog span{display:block;height:100%;background:var(--blue);transition:width .3s}
.dash{display:grid;gap:12px}
.dash .kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.dash .row2{display:grid;grid-template-columns:3fr 2fr;gap:12px}
.panel{border:1.5px solid var(--rule);border-radius:8px;padding:12px 14px;background:var(--surface)}
.panel h4{margin:0 0 6px;font-size:.92rem}
.sel-bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:.88rem;min-height:30px}
.check{list-style:none;padding:0;margin:8px 0 0}
.check li{padding:4px 0 4px 28px;position:relative}
.check li::before{content:"";position:absolute;left:0;top:7px;width:16px;height:16px;border:1.5px solid var(--rule);border-radius:4px}
.check li.ok::before{background:var(--green);border-color:var(--green)}
.check li.ok::after{content:"";position:absolute;left:5px;top:9px;width:5px;height:9px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg)}
.snow-wrap{background:var(--surface-2);border:1.5px solid var(--rule);border-radius:8px;overflow:hidden}
.yearbig{font-family:var(--serif);font-weight:700;fill:var(--grid);font-size:120px}

/* ---------- responsive ---------- */
@media (max-width: 980px){
  .app{grid-template-columns:1fr}
  .side{position:fixed;left:0;top:0;bottom:0;width:290px;height:100%;z-index:40;transform:translateX(-102%);transition:transform .25s;padding-top:calc(26px + env(safe-area-inset-top,0px))}
  .side.open{transform:none;box-shadow:0 0 0 100vmax rgba(10,15,20,.35)}
  .topbar{display:flex;position:sticky;top:0;z-index:30;align-items:center;gap:12px;padding:10px 16px;padding-top:calc(10px + env(safe-area-inset-top,0px));background:var(--surface);border-bottom:1.5px solid var(--rule)}
  .topbar .t{font-family:var(--serif);font-weight:700}
  .page{padding:28px 18px 70px}
  .grid4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .grid3{grid-template-columns:1fr}
  .ex-grid{grid-template-columns:1fr}
  .palette{grid-template-columns:repeat(5,1fr)}
  .dash .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .dash .row2{grid-template-columns:1fr}
}
@media (max-width: 620px){
  table.plain{font-size:.8rem}
  table.plain th,table.plain td{padding:6px 5px}
  .page .scroll-x{margin-right:-18px}
  .grid2{grid-template-columns:1fr}
  .board{grid-template-columns:1fr 1fr}
  .palette{grid-template-columns:repeat(3,1fr)}
  .vcard .uw{grid-template-columns:1fr}
  .cardgrid{grid-template-columns:1fr}
}
</style>
</head>

function lstats(xs,ys){const n=xs.length,mx=d3.mean(xs),my=d3.mean(ys);let sxx=0,syy=0,sxy=0;for(let i=0;i<n;i++){sxx+=(xs[i]-mx)**2;syy+=(ys[i]-my)**2;sxy+=(xs[i]-mx)*(ys[i]-my)}const b=sxy/sxx;return{mx,my,vx:sxx/(n-1),vy:syy/(n-1),r:sxy/Math.sqrt(sxx*syy),b,a:my-b*mx}}

function ch1(){return `
<div class="cover">

<p>In 1973, the statistician Francis Anscombe published four small datasets. Each one has eleven pairs of <i>x</i> and <i>y</i> values. Go through the tables below, and pay close attention to the summary rows at the bottom of each one.</p>

 <div class="box"><h4>The Datasaurus Dozen</h4><p>In 2017, Justin Matejka and George Fitzmaurice took Anscombe's idea further. They built thirteen datasets with nearly identical means, standard deviations and correlations. When you plot one of them, you get a drawing of a dinosaur. Search for "Datasaurus Dozen" online to see all thirteen shapes.</p></div>

function encGame(){

 function draw(){const tr=trials[t];$('#encQ').textContent=`Round ${t+1} of 6: ${names[tr.k]}. What percentage of A is B?`;
  const svg=mkSvg('#encViz',420,190),r=tr.ratio/100;
  if(tr.k==='bar'){const H=150;[[1,'A'],[r,'B']].forEach(([v,l],i)=>{svg.append('rect').attr('x',120+i*120).attr('y',165-H*v).attr('width',60).attr('height',H*v).style('fill','var(--c1)');svg.append('text').attr('x',150+i*120).attr('y',182).attr('text-anchor','middle').attr('class','lbl-strong').text(l)});svg.append('line').attr('x1',90).attr('x2',330).attr('y1',165).attr('y2',165).style('stroke','var(--ink-3)')}

   g.selectAll('text').data(arcs).join('text').attr('transform',d=>`translate(${a.centroid(d)})`).attr('text-anchor','middle').attr('dy','.35em').style('fill','#fff').style('font-weight',700).text((d,i)=>i?'B':'A')}
  if(tr.k==='area'){const R0=75;[[1,'A',120],[r,'B',300]].forEach(([v,l,cx])=>{svg.append('circle').attr('cx',cx).attr('cy',95).attr('r',R0*Math.sqrt(v)).style('fill','var(--c1)');svg.append('text').attr('x',cx).attr('y',186).attr('text-anchor','middle').attr('class','lbl-strong').text(l)})}

 $('#encGo').onclick=()=>{const b=$('#encGo');

   res.forEach((d,i)=>{svg.append('text').attr('x',0).attr('y',38+i*48).text(names[d.k].split(' (')[0].replace(' on a common baseline','')).attr('class','lbl-strong');svg.append('rect').attr('x',170).attr('y',24+i*48).attr('height',22).attr('width',Math.max(2,x(d.e))).style('fill',i===0?'var(--c1)':'var(--muted)');svg.append('text').attr('x',176+x(d.e)).attr('y',40+i*48).attr('class','lbl-strong').text(d.e.toFixed(1)+' pts')});

<p>Each bubble is a country. Its position shows income per person (across) and life expectancy (up). Size shows population, and colour shows region. Press Play and watch sixty years unfold.</p>

<h2>Why the log scale matters</h2>
<p>On a linear axis, every step adds the same amount: $10,000, $20,000, $30,000. On a log axis, every step multiplies: $1,000, $10,000, $100,000. Income grows by multiplying, so a family moving from $1,000 to $2,000 has made the same leap as one moving from $20,000 to $40,000. The log scale shows both leaps as the same distance, and it stops the rich countries from squeezing everyone else into a corner.</p>
<h2>The instincts that fool us</h2>
<p>In his book <i>Factfulness</i> (2018), Rosling described ten instincts that distort our view of the world. Two of them matter most for anyone who makes charts.</p>
<div class="grid2">
 <div class="box" style="margin:0"><h4>The gap instinct</h4><p class="small" style="color:var(--ink-2)">We love to split things into two groups with a gap between them: "developed" and "developing", "us" and "them". Look at the bubbles in 2020: most people live in the middle, not at either extreme. When a chart shows only averages of two groups, ask where the rest of the data is.</p></div>
 <div class="box" style="margin:0"><h4>The straight-line instinct</h4><p class="small" style="color:var(--ink-2)">We assume a trend will continue in a straight line. Real curves bend: population growth slows, adoption curves flatten. Before extending a trend on a forecast chart, ask what would make it bend.</p></div>
</div>
<div class="box"><h4>More from Gapminder</h4><p>Gapminder's free tools let you build these charts with hundreds of indicators. Its Dollar Street project shows photographs of how families at different income levels actually live, from their toothbrushes to their stoves, and is a powerful reminder that data describes real people.</p></div>
<div class="box good"><h4>Takeaway</h4><p>Animation is powerful when time is the story and a narrator guides the eye. Choose scales that match how the quantity behaves, and watch out for the instincts that make us see gaps and straight lines that are not there.</p></div>

 {id:'ex1',title:'Exercise 1: Koshy Super Store Monthly Business Review',brief:'<p>Koshy Super Store runs twelve outlets across Kochi, Thrissur and Kozhikode. The regional head reviews performance on the first working day of every month and wants one screen that answers five questions: are we on target, how are we trending, which stores are leading or lagging, what is driving the change, and are our staff rosters matched to footfall?</p>',

  slots:[{id:'A',col:'1/4',row:'1',brief:'Live counts: orders today, average delivery time and % of orders delivered late',best:['kpi'],ok:['bullet'],why:'Live KPI cards answer "how are we doing right now?" at a glance.'},

 $$('.slot',board).forEach(el=>{el.ondragover=e=>{e.preventDefault();el.classList.add('sel')};el.ondragleave=()=>el.classList.toggle('sel',sel===el.dataset.id);el.ondrop=e=>{e.preventDefault();const t=e.dataTransfer.getData('text/plain');if(CT[t])assign(el.dataset.id,t)}});
 $('#connBtn').onclick=()=>{mode=mode==='connect'?'assign':'connect';src=null;$('#connBar').innerHTML=mode==='connect'?'<div class="conn-bar">Click the block people will click on (the source).</div>':'';render()};
 $('#connList').onclick=e=>{const b=e.target.closest('button');if(!b)return;st.c.splice(+b.dataset.i,1);save();checked=false;render()};
 $('#clrBtn').onclick=()=>{st.a={};st.c=[];save();checked=false;sel=ex.slots[0].id;$('#exRes').innerHTML='';$('#modelBtn').disabled=true;render()};
 $('#chkBtn').onclick=()=>{checked=true;let pts=0;
  ex.slots.forEach(s=>{const t=st.a[s.id],fb=$(`.slot[data-id="${s.id}"] .fb`,board);fb.classList.remove('hidden','best','ok','bad');
   if(!t){fb.classList.add('bad');fb.textContent='Empty. '+s.why}
   else if(s.best.includes(t)){pts+=10;fb.classList.add('best');fb.textContent='Best choice. '+s.why}
   else if(s.ok.includes(t)){pts+=6;fb.classList.add('ok');fb.textContent=`Acceptable, but not the best. ${s.why}`}
   else{fb.classList.add('bad');fb.textContent=`${CT[t][0]} ${CT[t][1]}. ${s.why}`}});
  const has=(a,b)=>st.c.some(c=>c[0]===a&&c[1]===b),per=40/ex.req.length;let cp=0,extra=0;
  const reqFb=ex.req.map(r=>{const ok=has(r[0],r[1]);if(ok)cp+=per;return `<li>${ok?'<span class="up">Found</span>':'<span class="down">Missing</span>'}: <b>${r[0]} → ${r[1]}</b>. ${r[2]}</li>`});
  const extraFb=st.c.filter(c=>!ex.req.some(r=>r[0]===c[0]&&r[1]===c[1])).map(c=>{const o=ex.opt.find(r=>r[0]===c[0]&&r[1]===c[1]);if(o)return `<li><span class="up">Good extra</span>: <b>${c[0]} → ${c[1]}</b>. ${o[2]}</li>`;extra++;
   return `<li><span class="down">Not needed</span>: <b>${c[0]} → ${c[1]}</b>. ${c[0]==='A'?'KPI cards are usually the target of filters, not the source.':'This link does not answer any question in the brief, and extra links make a dashboard harder to predict.'}</li>`});
  const total=Math.max(0,Math.round(pts+cp-extra*4));
  $('#exRes').innerHTML=`<div class="fig reveal" style="margin-top:18px"><div class="grid2" style="align-items:center"><div><p class="small" style="margin:0">Your score</p><p class="score">${total}<span class="small"> / 100</span></p></div>
  <div class="small">Charts: ${pts} of 60<br>Required connections: ${Math.round(cp)} of 40<br>${extra?`Unneeded connections: −${extra*4}`:'No unneeded connections'}</div></div>
  <h3>Connections</h3><ul style="padding-left:18px">${reqFb.join('')}${extraFb.join('')}</ul>
  <p class="small">Block feedback is shown inside each block on the board. Change anything and check again, or open the model answer.</p></div>`;
  $('#modelBtn').disabled=false;render();$$('.slot .fb',board).forEach(f=>f.classList.remove('hidden'));markSeen('practice')};
 $('#modelBtn').onclick=()=>{ex.slots.forEach(s=>st.a[s.id]=s.best[0]);st.c=ex.req.map(r=>[r[0],r[1],'filters']);save();checked=false;render();
  $('#exRes').innerHTML=`<div class="box good reveal"><h4>Model answer</h4><ul style="padding-left:18px;margin:0">${ex.slots.map(s=>`<li><b>${s.id}: ${s.best.map(b=>CT[b][0]).join(' or ')}</b>. ${s.why}</li>`).join('')}${ex.req.map(r=>`<li><b>${r[0]} → ${r[1]}</b> (filters). ${r[2]}</li>`).join('')}</ul><p class="small" style="margin-top:8px">Optional links that would also be sensible: ${ex.opt.map(o=>o[0]+' → '+o[1]).join(', ')}.</p></div>`};
 sel=(ex.slots.find(s=>!st.a[s.id])||ex.slots[0]).id;render();
 const ro=new ResizeObserver(()=>{if(document.body.contains(board))links();else ro.disconnect()});ro.observe(board);
}

/* =========================================================
   FINAL QUIZ
   ========================================================= */
const QUIZ=[
 {ch:1,q:'Four datasets share the same mean, variance, correlation and regression line. What can you conclude about them?',opts:['Nothing about their shape until you plot them','They are the same dataset','They all have a linear relationship','They have no outliers'],exp:'This is Anscombe\'s lesson: identical summary statistics can hide completely different patterns.'},
 {ch:2,q:'What was John Snow\'s key insight from mapping cholera deaths in 1854?',opts:['Deaths clustered around one water pump, pointing to contaminated water','Cholera spread through bad air from sewers','Richer streets had fewer deaths','Deaths were evenly spread across Soho'],exp:'The map showed deaths clustered around the Broad Street pump, supporting Snow\'s theory that cholera spread through water.'},
 {ch:2,q:'Which visual encoding do people judge most accurately?',opts:['Position along a common scale','Area of circles','Angle of pie slices','Colour intensity'],exp:'Cleveland and McGill found position on a common scale to be the most accurate, which is why bar and dot charts are so effective.'},
 {ch:3,q:'Aman Mart wants to show how last year\'s revenue became this year\'s revenue through each category\'s gain or loss. Which chart fits best?',opts:['Waterfall chart','Scatter plot','Histogram','Heatmap'],exp:'A waterfall walks from a starting total through each positive and negative contribution to the ending total.'},
 {ch:4,q:'A manager wants to compare the shares of 11 product sub-categories. What is the better choice?',opts:['A sorted bar chart','A pie chart with 11 slices','A 3D pie chart','A line chart'],exp:'With many parts, pie slices become hard to rank and colours hard to match. A sorted bar chart stays readable.',pre:el=>{const svg=mkSvg(el,300,170),g=svg.append('g').attr('transform','translate(85,85)'),vals=[18,14,12,10,9,8,8,7,6,5,3];g.selectAll('path').data(d3.pie().sort(null)(vals)).join('path').attr('d',d3.arc().innerRadius(0).outerRadius(75)).style('fill',(d,i)=>PAL12[i]).style('stroke','var(--surface)');svg.append('text').attr('x',180).attr('y',90).style('font-size','11.5px').text('11 slices: which is 4th?')}},
 {ch:5,q:'Which title is most useful on a chart shown to the regional head?',opts:['Dairy margin fell to 6% in Aug 2025, the lowest in two years','Dairy margin chart','Monthly margin analysis, FY 2025-26','Gross margin % by month (Dairy)'],exp:'An action title states the insight. The reader knows what to look for and why it matters.'},
 {ch:5,q:'You must show growth versus last year for 14 stores, some up and some down. Which colour palette fits best?',opts:['Diverging, centred on zero growth','Sequential, light to dark','Rainbow','A different categorical colour per store'],exp:'Growth has a meaningful midpoint (zero). A diverging palette shows at once which side each store falls on.'},
 {ch:6,q:'What is wrong with this chart?',opts:['The y-axis starts at ₹48 L, exaggerating a small difference','The bars should be the same colour','There are too few bars','The labels should be inside the bars'],exp:'The real difference is about 4%, but because the axis starts at ₹48 L, one bar looks several times taller. Bar charts should start at zero.',pre:el=>{const svg=mkSvg(el,300,170),y=d3.scaleLinear([48,52.5],[150,10]);[['Store P',50.1],['Store Q',52.2]].forEach(([n,v],i)=>{svg.append('rect').attr('x',70+i*100).attr('width',60).attr('y',y(v)).attr('height',150-y(v)).style('fill','var(--c1)');svg.append('text').attr('x',100+i*100).attr('y',166).attr('text-anchor','middle').text(n)});svg.append('g').attr('class','axis').attr('transform','translate(50,0)').call(d3.axisLeft(y).ticks(4).tickFormat(d=>'₹'+d+' L'))}},
 {ch:6,q:'A news channel says sales "crashed 20%" by comparing the Diwali month with January. What is the pitfall?',opts:['A cherry-picked time window that ignores seasonality','A truncated y-axis','A dual axis','Too many KPIs'],exp:'Comparing a festive peak with an ordinary month creates a false decline. Compare with the same month last year, or show the full history.'},
 {ch:7,q:'Why place four KPI cards along the top-left of a dashboard?',opts:['The eye lands there first, so the most important numbers are seen in the first second','It leaves the centre free for decoration','KPI cards must always be the smallest widgets','It hides them from casual readers'],exp:'Readers scan in a Z or F pattern starting at the top-left. That prime space belongs to the numbers that matter most.'},
 {ch:8,q:'Aman Mart\'s dashboard shows yearly sales. The analyst clicks 2025 to see quarterly figures. What is this?',opts:['Drill down','Roll up','Drill across','Dice'],exp:'Moving from year to quarter goes one level deeper in the Time hierarchy.'},
 {ch:8,q:'From quarterly sales by city, the analyst goes back to yearly sales by region. What is this?',opts:['Roll up','Drill down','Drill across','Slice'],exp:'Rolling up re-aggregates detail into summary levels of the hierarchies.'},
 {ch:8,q:'The analyst jumps from "Sales of Snacks in Latur, Dec 2025" to "Stock of Snacks for Latur at Madavi Warehouse, Dec 2025". Why is this possible?',opts:['Both datasets share the same product, location and time dimensions','Both datasets are stored in Excel','The warehouse data is a subset of sales data','Madavi Warehouse is in Latur'],exp:'Drill across works when two fact tables share conformed dimensions, so the same coordinates mean the same thing in both.'},
 {ch:9,q:'In Rosling\'s Gapminder bubble chart, what does the size of each bubble show?',opts:['Population','Income per person','Life expectancy','Region'],exp:'Bubble area shows population. Position shows income and life expectancy; colour shows region.'},
 {ch:10,q:'What makes the Our World in Data grapher especially good for exploration?',opts:['Readers can switch between chart, map and table views and choose countries and years themselves','It uses 3D charts','It shows every indicator on one page','It hides sources to keep the page clean'],exp:'Linked views plus reader control let people ask their own questions, while visible sources keep the work checkable.'}];
QUIZ.forEach((q,k)=>{q.id='final-'+(k+1)});
const CH_TITLES={1:'Same numbers, different stories',2:'Why visualise, and how our eyes read charts',3:'The visual vocabulary',4:'Choosing the right chart',5:'Best practices',6:'Pitfalls',7:'Anatomy of a dashboard',8:'Drill down, roll up and drill across',9:'Let the data move',10:'World-class dashboards'};
function chQ(){return `
<p class="ch-num">Final quiz</p>
<h1>Test yourself</h1>
<p class="lede">Fifteen questions across all ten chapters. You will see the explanation after each answer, and a list of chapters to revisit at the end.</p>
<div id="quizBox"></div>`}
function chQInit(){let i=0,res=[];const box=$('#quizBox');window.__trk&&(__trk.resetQuestions(QUIZ.map(x=>x.id)),__trk.track('quiz_started',{quiz:'final'}));
 function q(){if(i>=QUIZ.length)return end();const Q=QUIZ[i];box.innerHTML=`<div class="controls" style="justify-content:space-between;margin:0"><b>Question ${i+1} of ${QUIZ.length}</b><span class="small">From Chapter ${Q.ch}</span></div><div class="qprog"><span style="width:${i/QUIZ.length*100}%"></span></div><div id="qPre"></div><div id="qM"></div><div class="controls hidden" id="qNext"><button class="btn primary">${i<QUIZ.length-1?'Next question':'See my results'}</button></div>`;
  if(Q.pre){const d=document.createElement('div');d.style.maxWidth='320px';$('#qPre').appendChild(d);Q.pre(d)}
  mcq($('#qM'),Q,ok=>{res[i]=ok;$('#qNext').classList.remove('hidden')});$('#qNext button').onclick=()=>{i++;q();box.scrollIntoView({behavior:'smooth',block:'start'})}}
 function end(){const sc=res.filter(Boolean).length,miss=[...new Set(QUIZ.filter((x,k)=>!res[k]).map(x=>x.ch))].sort((a,b)=>a-b);store.set('quiz',sc);window.__trk&&__trk.track('quiz_submitted',{quiz:'final',kind:'final_quiz',score:sc,total:QUIZ.length});
  box.innerHTML=`<div class="fig reveal"><p class="small" style="margin:0">Your score</p><p class="score">${sc}<span class="small"> / ${QUIZ.length}</span></p>
  <p>${sc>=13?'Excellent. You are ready to design dashboards that people actually use.':sc>=10?'Good work. A quick revisit of the chapters below will close the gaps.':sc>=7?'A fair start. Go back through the chapters below, then try again.':'Worth another pass. Work through the chapters below carefully, then take the quiz again.'}</p>
  ${miss.length?`<h3>Chapters to revisit</h3><div class="controls">${miss.map(c=>`<button class="btn sm" data-go="c${c}">Chapter ${c}: ${CH_TITLES[c]}</button>`).join('')}</div>`:'<p>You answered every question correctly.</p>'}
  <h3>Your answers</h3><ol style="padding-left:20px">${QUIZ.map((x,k)=>`<li style="margin-bottom:6px"><span class="${res[k]?'up':'down'}" style="font-weight:700">${res[k]?'Correct':'Missed'}</span>: ${x.q}<br><span class="small">Answer: ${x.opts[0]}</span></li>`).join('')}</ol>
  <button class="btn primary" id="qAgain">Take the quiz again</button></div>`;
  $('#qAgain').onclick=()=>{i=0;res=[];window.__trk&&(__trk.resetQuestions(QUIZ.map(x=>x.id)),__trk.track('quiz_retaken',{quiz:'final'}));q()};box.onclick=e=>{const b=e.target.closest('[data-go]');if(b)location.hash=b.dataset.go};markSeen('quiz')}
 q()}

/* =========================================================
   ROUTER, NAVIGATION, PROGRESS, THEME
   ========================================================= */
const CHAPTERS=[
 {id:'c1',n:'1',t:'Same numbers, different stories',r:ch1,i:ch1Init},{id:'c2',n:'2',t:'Why visualise, and how our eyes read charts',r:ch2,i:ch2Init},{id:'c3',n:'3',t:'The visual vocabulary',r:ch3,i:ch3Init},
 {id:'c4',n:'4',t:'Choosing the right chart',r:ch4,i:ch4Init},{id:'c5',n:'5',t:'Best practices',r:ch5,i:ch5Init},{id:'c6',n:'6',t:'Pitfalls: how charts mislead',r:ch6,i:ch6Init},
 {id:'c7',n:'7',t:'Anatomy of a dashboard',r:ch7,i:ch7Init},{id:'c8',n:'8',t:'Drill down, roll up and drill across',r:ch8,i:ch8Init},{id:'c9',n:'9',t:'Let the data move',r:ch9,i:ch9Init},
 {id:'c10',n:'10',t:'World-class dashboards',r:ch10,i:ch10Init},{id:'practice',n:'◆',t:'Practice studio',r:chP,i:chPInit,sep:true},{id:'quiz',n:'?',t:'Final quiz',r:chQ,i:chQInit}];
const prog=store.get('progress',{});
function markDone(id){prog[id]='done';store.set('progress',prog);toc()}
function markSeen(id){if(!prog[id]){prog[id]='seen';store.set('progress',prog);toc()}}
let curId=null;
function toc(){$('#toc').innerHTML=CHAPTERS.map(c=>`${c.sep?'<li><hr class="toc-sep"></li>':''}<li><button data-id="${c.id}" ${c.id===curId?'aria-current="page"':''}><span class="n">${c.n}</span><span>${c.t}</span><span class="st ${prog[c.id]||''}" title="${prog[c.id]==='done'?'Complete':prog[c.id]==='seen'?'Visited':'Not started'}"></span></button></li>`).join('');
 const done=CHAPTERS.filter(c=>c.id.startsWith('c')&&prog[c.id]==='done').length;$('#progText').textContent=`${done} of 10 chapters complete`;$('#progBar').style.width=done*10+'%'}
function go(id){const c=CHAPTERS.find(x=>x.id===id)||CHAPTERS[0];curId=c.id;hideTip();
 const k=CHAPTERS.indexOf(c),prev=CHAPTERS[k-1],next=CHAPTERS[k+1];
 $('#page').innerHTML=c.r()+`<nav class="pager" aria-label="Chapter navigation">${prev?`<button class="btn" data-go="${prev.id}">← ${prev.id.startsWith('c')?'Chapter '+prev.n:prev.t}</button>`:'<span></span>'}${next?`<button class="btn primary" data-go="${next.id}">${next.id.startsWith('c')?'Chapter '+next.n+': '+next.t:next.t} →</button>`:'<span></span>'}</nav>`;
 if(c.id.startsWith('c'))markSeen(c.id);
 try{c.i()}catch(err){console.error(err)}
 toc();window.scrollTo(0,0);$('#side').classList.remove('open');store.set('last',c.id)}
$('#page').addEventListener('click',e=>{const b=e.target.closest('.pager [data-go]');if(b)location.hash=b.dataset.go});
$('#toc').addEventListener('click',e=>{const b=e.target.closest('button[data-id]');if(b){if(location.hash==='#'+b.dataset.id)go(b.dataset.id);else location.hash=b.dataset.id}});
window.addEventListener('hashchange',()=>go(location.hash.slice(1)));
$('#menuBtn').onclick=()=>$('#side').classList.toggle('open');
document.addEventListener('click',e=>{const s=$('#side');if(s.classList.contains('open')&&!s.contains(e.target)&&e.target!==$('#menuBtn'))s.classList.remove('open')});
/* theme */
function setTheme(t){if(t==='auto')document.documentElement.removeAttribute('data-theme');else document.documentElement.setAttribute('data-theme',t);store.set('theme',t);$$('.side-foot .seg button').forEach(b=>b.classList.toggle('on',b.dataset.theme===t))}
$$('.side-foot .seg button').forEach(b=>b.onclick=()=>setTheme(b.dataset.theme));
setTheme(store.get('theme','auto'));
go(location.hash.slice(1)||store.get('last','c1'));
</script>
