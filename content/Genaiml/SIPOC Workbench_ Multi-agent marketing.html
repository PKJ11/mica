<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SIPOC Workbench: Multi-agent marketing</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<style>
:root{
  --page:#F5F3EE; --paper:#FFFFFF; --ink:#211F1D; --muted:#6C675F; --line:#E5DFD5; --line-2:#D6CFC2;
  --brand:#B61D22; --brand-ink:#FFFFFF; --brand-soft:#F8EAE9; --brand-edge:#E7C6C4;
  --field:#FCFBF8;
  --good:#2C6E49; --good-soft:#E8F1EA; --part:#A66A16; --part-soft:#F8EFDF;
  --bad:#B61D22; --bad-soft:#F8EAE9; --blank:#77726A; --blank-soft:#EFEDE7;
  --display:"Source Serif 4", Georgia, "Times New Roman", serif;
  --body:"Inter", "Segoe UI", system-ui, -apple-system, sans-serif;
  --r:10px;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --page:#1A1917; --paper:#232220; --ink:#F1EFE9; --muted:#A8A399; --line:#343230; --line-2:#413E3A;
    --brand:#E4645F; --brand-ink:#1A1917; --brand-soft:#3A2220; --brand-edge:#5A3230;
    --field:#1C1B19;
    --good:#7FC79C; --good-soft:#1C2E23; --part:#E0AC63; --part-soft:#332713;
    --bad:#E4645F; --bad-soft:#3A2220; --blank:#A8A399; --blank-soft:#2A2926;
  }
}
:root[data-theme="dark"]{
    --page:#1A1917; --paper:#232220; --ink:#F1EFE9; --muted:#A8A399; --line:#343230; --line-2:#413E3A;
    --brand:#E4645F; --brand-ink:#1A1917; --brand-soft:#3A2220; --brand-edge:#5A3230;
    --field:#1C1B19;
    --good:#7FC79C; --good-soft:#1C2E23; --part:#E0AC63; --part-soft:#332713;
    --bad:#E4645F; --bad-soft:#3A2220; --blank:#A8A399; --blank-soft:#2A2926;
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%; scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0; background:var(--page); color:var(--ink); font-family:var(--body); font-size:15px; line-height:1.55; letter-spacing:-0.005em; -webkit-font-smoothing:antialiased}
button,input,textarea{font:inherit; color:inherit}
:focus-visible{outline:2px solid var(--brand); outline-offset:2px}
.wrap{max-width:1180px; margin:0 auto; padding:34px 24px 0}

header.top{margin-bottom:22px}
header.top h1{font-family:var(--display); font-weight:600; font-size:clamp(30px,3.6vw,44px); line-height:1.06; letter-spacing:-0.02em; margin:0}
header.top h1 .dot{color:var(--brand)}
header.top p{margin:10px 0 0; color:var(--muted); max-width:68ch; font-size:16px}

nav.tabs{display:flex; flex-wrap:wrap; gap:8px; margin-bottom:26px}
nav.tabs button{flex:1 1 150px; background:var(--paper); border:1px solid var(--line); border-radius:var(--r); padding:11px 14px; cursor:pointer; color:var(--muted); display:flex; gap:9px; align-items:baseline; text-align:left; transition:border-color .12s ease, color .12s ease}
nav.tabs button:hover{border-color:var(--line-2); color:var(--ink)}
nav.tabs button .n{font-family:var(--display); font-weight:600; font-size:19px; line-height:1}
nav.tabs button .t{font-weight:500; font-size:13.5px; line-height:1.25}
nav.tabs button[aria-selected="true"]{background:var(--brand); border-color:var(--brand); color:var(--brand-ink)}
nav.tabs button[aria-selected="true"] .n{color:var(--brand-ink)}
nav.tabs button .dot{font-size:11px; font-weight:600; color:var(--good); align-self:center; margin-left:auto}
nav.tabs button[aria-selected="true"] .dot{color:var(--brand-ink); opacity:.85}

.intro{display:grid; grid-template-columns:minmax(0,1.8fr) minmax(250px,1fr); gap:16px; margin-bottom:34px}
.brief, .team{background:var(--paper); border:1px solid var(--line); border-radius:var(--r); padding:24px 26px}
.brief h2{font-family:var(--display); font-weight:600; font-size:27px; line-height:1.15; letter-spacing:-0.02em; margin:0 0 10px}
.brief p{margin:0 0 12px; max-width:76ch}
.brief h3{font-size:12px; font-weight:600; letter-spacing:.07em; text-transform:uppercase; color:var(--muted); margin:18px 0 7px}
.brief ul{margin:0; padding-left:18px}
.brief li{margin-bottom:5px}
.brief li b{font-weight:600}
.scope{background:var(--brand-soft); border:1px solid var(--brand-edge); border-radius:var(--r); padding:10px 14px; margin:18px 0 0 !important}
.team{display:flex; flex-direction:column; gap:14px}
.team h2{font-family:var(--display); font-weight:600; font-size:19px; margin:0}
label.f{display:flex; flex-direction:column; gap:6px; font-size:12px; font-weight:600; letter-spacing:.06em; text-transform:uppercase; color:var(--muted)}
input[type=text], textarea{background:var(--field); border:1px solid var(--line-2); border-radius:8px; padding:10px 12px; font-weight:400; font-size:15px; letter-spacing:normal; text-transform:none; color:var(--ink); width:100%; box-shadow:none}
textarea{resize:vertical; line-height:1.55}
input[type=text]:focus, textarea:focus{border-color:var(--brand); outline:none}
::placeholder{color:var(--muted); opacity:.7}

.howto{display:flex; flex-wrap:wrap; justify-content:space-between; align-items:baseline; gap:6px 20px; margin-bottom:14px}
.howto h2{font-family:var(--display); font-weight:600; font-size:24px; letter-spacing:-0.02em; margin:0}
.howto p{margin:0; color:var(--muted); font-size:14px}
.howto code{font-family:var(--body); font-weight:600; background:var(--brand-soft); color:var(--brand); padding:2px 7px; border-radius:5px}

.board{display:flex; flex-direction:column; gap:12px}
.row{display:grid; grid-template-columns:120px minmax(0,1fr) 320px; background:var(--paper); border:1px solid var(--line); border-radius:var(--r); overflow:hidden}
.row[data-verdict="correct"]{border-color:var(--good)}
.row[data-verdict="partial"]{border-color:var(--part)}
.row[data-verdict="incorrect"]{border-color:var(--bad)}
.tag{padding:18px 16px; display:flex; flex-direction:column; gap:4px; background:var(--brand-soft)}
.letter{font-family:var(--display); font-weight:600; font-size:58px; line-height:.86; color:var(--brand)}
.tag .nm{font-weight:600; font-size:14.5px}
.field{padding:18px 20px; display:flex; flex-direction:column; gap:9px; min-width:0}
.field .q{font-size:13.5px; font-weight:500; color:var(--muted)}
.field textarea{min-height:104px; font-size:15px}
.row.proc .field textarea{min-height:200px}
details.hint{font-size:13.5px}
details.hint summary{cursor:pointer; font-weight:600; color:var(--brand); list-style:none; display:inline-flex; gap:6px; align-items:center}
details.hint summary::-webkit-details-marker{display:none}
details.hint summary::after{content:"\203A"; transform:rotate(90deg); display:inline-block; font-weight:700}
details.hint[open] summary::after{transform:rotate(-90deg)}
details.hint p{margin:8px 0 0; background:var(--brand-soft); border-radius:8px; padding:10px 13px; max-width:92ch; color:var(--ink)}

.ev{border-left:1px solid var(--line); padding:18px 20px; font-size:13.5px; background:var(--paper)}
.ev .empty{color:var(--muted); margin:0}
.ev[data-verdict="correct"]{background:var(--good-soft)}
.ev[data-verdict="partial"]{background:var(--part-soft)}
.ev[data-verdict="incorrect"]{background:var(--bad-soft)}
.ev[data-verdict="blank"]{background:var(--blank-soft)}
.chip{display:inline-block; font-weight:600; font-size:12px; padding:3px 10px; border-radius:20px; color:#fff}
.chip[data-v="correct"]{background:var(--good)} .chip[data-v="partial"]{background:var(--part)}
.chip[data-v="incorrect"]{background:var(--bad)} .chip[data-v="blank"]{background:var(--blank)}
.ev p{margin:8px 0 0}
.ev h4{margin:12px 0 3px; font-size:12px; font-weight:600; letter-spacing:.05em; text-transform:uppercase}
.ev ul{margin:0; padding-left:17px}
.ev li{margin-bottom:3px}
.ev .r h4{color:var(--good)} .ev .w h4{color:var(--bad)} .ev .h h4{color:var(--part)}

.actions{position:sticky; bottom:0; margin-top:22px; background:var(--page); border-top:1px solid var(--line); padding:14px 0 calc(14px + env(safe-area-inset-bottom,0px)); display:flex; flex-wrap:wrap; align-items:center; gap:10px 14px; z-index:5}
.btn{border:1px solid var(--brand); background:var(--brand); color:var(--brand-ink); border-radius:8px; padding:10px 20px; font-weight:600; cursor:pointer}
.btn:disabled{opacity:.55; cursor:progress}
.btn.ghost{background:transparent; color:var(--brand)}
.btn.quiet{border-color:transparent; background:transparent; color:var(--muted); font-weight:500; padding:10px 8px}
.status{color:var(--muted); font-size:14px; flex:1 1 260px}
.status.err{color:var(--bad)}
.spin{display:inline-block; width:13px; height:13px; border:2px solid var(--line-2); border-top-color:var(--brand); border-radius:50%; animation:sp .8s linear infinite; vertical-align:-2px; margin-right:7px}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion: reduce){.spin{animation-duration:2.4s}}

.overall{margin-top:24px; background:var(--paper); border:1px solid var(--line); border-radius:var(--r); padding:22px 26px; display:none; grid-template-columns:auto 1fr; gap:8px 26px; align-items:center}
.overall.show{display:grid}
.score{font-family:var(--display); font-weight:600; font-size:54px; line-height:1; color:var(--brand)}
.score small{font-size:18px; color:var(--muted); font-weight:500}
.overall p{margin:0; max-width:80ch}
.overall .stale{grid-column:1/-1; color:var(--part); font-size:13.5px; font-weight:600}

@media (max-width:1020px){
  .row{grid-template-columns:104px minmax(0,1fr)}
  .ev{grid-column:2; border-left:0; border-top:1px solid var(--line)}
}
@media (max-width:820px){ .intro{grid-template-columns:1fr} }
@media (max-width:600px){
  .wrap{padding:22px 14px 0}
  .row{grid-template-columns:1fr}
  .tag{flex-direction:row; align-items:baseline; gap:12px; padding:12px 16px}
  .letter{font-size:36px}
  .ev{grid-column:1; border-top:1px solid var(--line)}
  .overall{grid-template-columns:1fr}
}
</style>
</head>

    </div>
  </header>

   c:"Who works these leads day to day, who manages them, who receives the emails, and who keeps the CRM clean?"}},
 {n:4, title:"SEO Content Cluster Builder",
  summary:"A company wants to rank in search for topics its customers care about by publishing a pillar page supported by a cluster of linked articles. AI agents research, plan, write and optimise, while people choose topics and check quality.",
  agents:[["Keyword Researcher Agent","finds search terms, intent and gaps"],["Cluster Architect Agent","designs the pillar page, supporting articles and internal linking map"],["Content Writer Agent","drafts the pillar and cluster articles"],["SEO Optimiser Agent","handles headings, meta titles and descriptions, internal links and schema"]],
  build:"A cluster planner with a visual topic map and a draft review queue.",
  scope:"Starts when seed topics are chosen. Ends when optimised drafts are approved.",
  hints:{s:"Who knows which topics matter to the business? Where does information about your existing pages, search behaviour and competing pages come from?",
   i:"What must the Cluster Architect know so it doesn't repeat pages you already have? What do the Writer and Optimiser need to know about the audience, the voice and the keywords?",
   p:"Who picks the starting topics? Where does a person check the plan before many articles are written at once? Who checks drafts for accuracy and real expertise?",
   o:"List the research, the plan, the drafts and the on-page SEO elements (think metadata, links and structured data).",
   c:"Who publishes and maintains this content, who owns search performance, who reads it, and which team benefits from the extra traffic?"}},
 {n:5, title:"Campaign Performance Analyst and Budget Reallocator",
  summary:"A marketing team runs campaigns across several paid and owned channels. AI agents combine the performance data, analyse it and recommend where to move budget, while people set the goals and approve any change in spend.",
  agents:[["Data Wrangler Agent","cleans and merges channel exports"],["Performance Analyst Agent","computes KPIs and spots anomalies"],["Optimiser Agent","proposes budget shifts within constraints"],["Reporter Agent","writes the stakeholder summary"]],
  build:"A performance dashboard with a recommend-and-approve workflow.",
  scope:"Starts when channel data is exported. Ends when the reallocation is approved and the report is sent.",
  hints:{s:"Where does the performance data come from? Who sets the budget, and who sets the goals?",
   i:"What raw data comes in? What definitions and limits must the Optimiser respect before it proposes moving money?",
   p:"What must be agreed before any analysis runs? Which steps clean, analyse, recommend and report? Where must a person challenge the recommendation and sign off?",
   o:"Think about the cleaned data, the KPI view, any unusual patterns found, the approved plan, and what goes to stakeholders.",
   c:"Who decides on marketing spend, who controls the money, who runs each channel, and who reads the summary?"}},
 {n:6, title:"AI-Powered Social Media Content Designer",
  summary:"A brand wants to create social media posts that ride current trends without drifting off-brand. AI agents study competitors and trends, design posts from the brand's own templates, and check every post for consistency, while people choose trends and approve the designs.",
  agents:[["Competitive Post Analyzer Agent","studies competitors' recent posts for formats, hooks, visual styles and engagement"],["Trend Spotter Agent","finds which post types, formats and themes are going viral in the niche"],["Post Designer Agent","creates post concepts, captions and visual layouts from the brand's templates"],["Consistency Catcher Agent","checks each post against voice and visual guidelines and sends off-brand drafts back with fixes"]],
  build:"A web app that turns a theme or occasion into branded post mockups, with a review screen showing trend inputs, competitor references and consistency check results.",

   o:"Beyond the post mockups and captions, which reports and records would help a reviewer understand why each post looks the way it does?",

function key(n){
  const pw = "logicology-sipoc-7", b = atob(K_), out = new Uint8Array(b.length);
  for (let i=0;i<b.length;i++) out[i] = b.charCodeAt(i) ^ pw.charCodeAt(i % pw.length);
  return JSON.parse(new TextDecoder().decode(out))[n];
}

const STORE = "sipoc-workbench-v1";
let state = {active:0, tabs:{}};
try { const s = JSON.parse(localStorage.getItem(STORE) || "null"); if (s && s.tabs) state = s; } catch(e) {}
function save(){ try { localStorage.setItem(STORE, JSON.stringify(state)); } catch(e) {} }
function tab(i = state.active){
  const n = UC[i].n;
  if (!state.tabs[n]) state.tabs[n] = {team:"", members:"", ans:{s:"",i:"",p:"",o:"",c:""}, result:null, checkedHash:null};
  return state.tabs[n];
}
const hash = t => JSON.stringify(t.ans);

const capUse = name => (window.claude && typeof window.claude.use === "function") ? window.claude.use(name).catch(() => null) : Promise.resolve(null);
const sampleP = capUse("sample");
const downloadsP = capUse("downloads");

const $ = s => document.querySelector(s);
const el = (tag, attrs={}, text) => { const e = document.createElement(tag); for (const [k,v] of Object.entries(attrs)) e.setAttribute(k,v); if (text != null) e.textContent = text; return e; };

function renderTabs(){
  const nav = $("#tabs"); nav.innerHTML = "";
  UC.forEach((u, i) => {
    const b = el("button", {role:"tab", "aria-selected": String(i === state.active), id:"tab-"+i});
    b.append(el("span",{class:"n"}, String(u.n)), el("span",{class:"t"}, u.title));
    const t = state.tabs[u.n];
    if (t && t.result) { const d = el("span",{class:"dot", title:"Checked"}, "Checked"); b.append(d); }
    b.onclick = () => { state.active = i; save(); renderTabs(); renderPanel(); window.scrollTo({top:0}); };
    nav.append(b);
  });
}

let busy = false, clearArmed = false;

function renderPanel(){
  const u = UC[state.active], t = tab();
  const p = $("#panel");
  p.innerHTML = `
  <section class="intro">
    <article class="brief">
      <h2>${u.title}</h2>
      <p>${u.summary}</p>
      <h3>Agents involved</h3>
      <ul>${u.agents.map(a => `<li><b>${a[0]}</b>: ${a[1]}</li>`).join("")}</ul>
      <h3>What you will build afterwards</h3>
      <p style="margin:0">${u.build}</p>
      <p class="scope"><b>Scope.</b> ${u.scope}</p>
    </article>
    <aside class="team">
      <h2>Your team</h2>
      <label class="f">Team name<input type="text" id="team" autocomplete="off" placeholder="e.g. Team Nova"></label>
      <label class="f">Team members<textarea id="members" rows="4" placeholder="One name per line"></textarea></label>
    </aside>
  </section>
  <div class="howto">
    <h2>Build your SIPOC</h2>
    <p>Write one item per line. In Process, number the steps and start a step with <code>Human:</code> when a person does it.</p>
  </div>
  <section class="board" id="board"></section>
  <section class="overall" id="overall" aria-live="polite"></section>
  <div class="actions">
    <button class="btn" id="check">Check answers</button>
    <button class="btn ghost" id="pdf">Download PDF</button>
    <span class="status" id="status" role="status"></span>
    <button class="btn quiet" id="clear">Clear this tab</button>
  </div>`;

  const board = $("#board");
  ELS.forEach(E => {
    const row = el("div", {class:"row" + (E.k === "p" ? " proc" : ""), id:"col-"+E.k});
    const tag = el("div", {class:"tag"}); tag.append(el("span",{class:"letter","aria-hidden":"true"}, E.L), el("span",{class:"nm"}, E.name));
    const field = el("div", {class:"field"});
    field.append(el("label", {class:"q", for:"ta-"+E.k}, E.q));
    const ta = el("textarea", {id:"ta-"+E.k, placeholder: E.k === "p" ? "1. Human: ...\n2. ... Agent ...\n3. ..." : "One item per line"});
    ta.value = t.ans[E.k] || "";
    ta.addEventListener("input", () => { t.ans[E.k] = ta.value; save(); markStale(); });
    const d = el("details", {class:"hint"}); d.append(el("summary", {}, "Show hint"), el("p", {}, u.hints[E.k]));
    d.addEventListener("toggle", () => { d.firstChild.textContent = d.open ? "Hide hint" : "Show hint"; });
    field.append(ta, d);
    row.append(tag, field, el("div", {class:"ev", id:"ev-"+E.k, "aria-live":"polite"}));
    board.append(row);
  });

  const team = $("#team"), mem = $("#members");
  team.value = t.team; mem.value = t.members;
  team.addEventListener("input", () => { t.team = team.value; save(); });
  mem.addEventListener("input", () => { t.members = mem.value; save(); });
  $("#check").onclick = check;
  $("#pdf").onclick = makePdf;
  $("#clear").onclick = () => {
    const b = $("#clear");
    if (!clearArmed) { clearArmed = true; b.textContent = "Select again to clear"; setTimeout(() => { clearArmed = false; if (b.isConnected) b.textContent = "Clear this tab"; }, 4000); return; }
    clearArmed = false;
    state.tabs[u.n] = null; delete state.tabs[u.n]; save(); renderTabs(); renderPanel(); setStatus("This tab has been cleared.");
  };
  renderResult();
}

function setStatus(msg, opts={}){
  const s = $("#status"); if (!s) return;
  s.className = "status" + (opts.err ? " err" : "");
  s.innerHTML = "";
  if (opts.spin) s.append(el("span",{class:"spin","aria-hidden":"true"}));
  s.append(document.createTextNode(msg));
}

function markStale(){
  const t = tab();
  const st = $("#overall .stale");
  if (t.result && st) st.hidden = (hash(t) === t.checkedHash);
}

function list(cls, title, items){
  const wrap = el("div",{class:cls}); wrap.append(el("h4",{},title));
  const ul = el("ul"); items.forEach(x => ul.append(el("li",{},x))); wrap.append(ul); return wrap;
}

function renderResult(){
  const t = tab(), r = t.result;
  ELS.forEach(E => {
    const col = $("#col-"+E.k), ev = $("#ev-"+E.k);
    ev.innerHTML = ""; col.removeAttribute("data-verdict"); ev.removeAttribute("data-verdict");
    if (!r) { ev.append(el("p",{class:"empty"},"Feedback appears here after you check your answers.")); return; }
    const x = r.elements[E.k];
    col.setAttribute("data-verdict", x.verdict); ev.setAttribute("data-verdict", x.verdict);
    ev.append(el("span",{class:"chip","data-v":x.verdict}, VL[x.verdict]));
    if (x.feedback) ev.append(el("p",{}, x.feedback));
    if (x.right.length) ev.append(list("r","What you got right", x.right));
    if (x.wrong.length) ev.append(list("w","What to rethink", x.wrong));
    if (x.hints.length) ev.append(list("h","What might be missing", x.hints));
  });
  const o = $("#overall"); o.innerHTML = ""; o.className = "overall";
  if (r) {
    o.classList.add("show");
    const sc = el("div",{class:"score"}); sc.append(document.createTextNode(String(r.score)), el("small",{}," / 100"));
    o.append(sc, el("p",{}, r.summary));
    const st = el("div",{class:"stale"}, "You have changed some answers since this check. Check again to update the feedback.");
    st.hidden = (hash(t) === t.checkedHash); o.append(st);
  }
}

function buildPrompt(u, k, t){
  const A = e => (t.ans[e] || "").trim() || "(blank)";
  return `You are a strict but encouraging teaching assistant grading a graduate student team's SIPOC diagram (Suppliers, Inputs, Process, Outputs, Customers) for a multi-agent AI marketing workflow they will later build with vibe coding.

USE CASE ${u.n}: ${u.title}
${u.summary}
Agents: ${u.agents.map(a => a[0] + " (" + a[1] + ")").join("; ")}
Scope: ${u.scope}

CONFIDENTIAL ANSWER KEY (the instructor's reference). Never quote, list or paraphrase any key item that the students have not already written themselves. Use it only to judge.
Suppliers: ${k.s}
Inputs: ${k.i}
Process: ${k.p}
Outputs: ${k.o}
Customers: ${k.c}

STUDENT ANSWERS (one item per line; in Process, steps starting with "Human:" are human-in-the-loop steps):
[Suppliers]
${A("s")}
[Inputs]
${A("i")}
[Process]
${A("p")}
[Outputs]
${A("o")}
[Customers]
${A("c")}

How to grade each element:
- Judge by meaning, not wording. Accept synonyms, reasonable groupings, and sensible extra items that genuinely fit the use case.
- Flag items that are wrong: placed in the wrong element (for example a person or team listed under Inputs, an output listed as an input, a supplier listed as a customer), irrelevant, or factually off.
- For key ideas the students missed, write hints that point toward the kind of thing that is missing WITHOUT naming the item. Good hint: "Think about which team owns the rules the reviewer agent checks against." Bad hint: "You missed the brand voice guide."
- Process: check that the steps follow a sensible order, name the agents doing the work, include human checkpoints before expensive or irreversible steps, and capture any feedback loop, parallel work or fan-out present in the key. Accept 4 to 8 steps.
- verdict: "correct" if nearly all key ideas are covered with no significant errors; "partial" if some key ideas are covered or there are minor errors; "incorrect" if most key ideas are missing or there are major errors; "blank" if the element is "(blank)".
- "right" items restate what the students got right, in a few words each. "wrong" items quote the student's item briefly and say why. Keep every string short.

Reply with only JSON in exactly this shape:
{"elements":{"s":E,"i":E,"p":E,"o":E,"c":E},"score":<integer 0-100 for the whole SIPOC>,"summary":"2-3 sentences of overall feedback that reveal no answer-key items"}
where each E is {"verdict":"correct|partial|incorrect|blank","right":[string],"wrong":[string],"hints":[string],"feedback":"one sentence"}`;
}

function normalize(r){
  if (!r || typeof r !== "object" || !r.elements) throw {code:"invalid_json"};
  const arr = v => Array.isArray(v) ? v.map(x => String(x)).filter(Boolean).slice(0,8) : [];
  const out = {elements:{}, score: Math.max(0, Math.min(100, Math.round(Number(r.score) || 0))), summary: String(r.summary || "")};
  for (const E of ELS) {
    const x = r.elements[E.k] || {};
    const v = ["correct","partial","incorrect","blank"].includes(x.verdict) ? x.verdict : "partial";
    out.elements[E.k] = {verdict:v, right:arr(x.right), wrong:arr(x.wrong), hints:arr(x.hints), feedback:String(x.feedback || "")};
  }
  return out;
}

const ERR = {
  not_granted:"Checking needs permission to use Claude. Reload the page and choose Allow when asked.",
  sampling_disabled:"Claude isn't available on this account, so answers can't be checked here.",
  rate_limited:"Too many checks in a short time, or your Claude usage limit has been reached. Wait a few minutes, then check again.",
  session_expired:"Your Claude session has expired. Sign in again, then check.",
  prompt_too_large:"Your answers are too long to check. Shorten them, then try again.",
  refused:"The check couldn't be completed for these answers. Edit them and try again."
};

async function check(){
  if (busy) return;
  const u = UC[state.active], t = tab(), n = u.n;
  if (!ELS.some(E => (t.ans[E.k] || "").trim())) { setStatus("Fill in at least one part of the SIPOC before checking.", {err:true}); return; }
  busy = true; const btn = $("#check"); btn.disabled = true; btn.textContent = "Checking…";
  setStatus("Checking your SIPOC. This usually takes 20 to 60 seconds.", {spin:true});
  const sample = await sampleP;
  if (!sample) {
    busy = false; btn.disabled = false; btn.textContent = "Check answers";
    setStatus("Checking works only when this page is opened in Claude while you're signed in.", {err:true}); return;
  }
  const snapshot = hash(t);
  try {
    const raw = await sample.json(buildPrompt(u, key(n), t), {modelTier:"default", cache:false});
    const r = normalize(raw);
    const tt = state.tabs[n]; if (!tt) throw {code:"cancelled"};
    tt.result = r; tt.checkedHash = snapshot; save();
    if (UC[state.active].n === n) { renderResult(); setStatus("Checked. Review the feedback beside each part, then download your PDF."); }
    renderTabs();
  } catch(e) {
    if (e && e.code === "cancelled") { setStatus(""); }
    else setStatus(ERR[e && e.code] || "The check didn't finish. Select Check answers to try again.", {err:true});
  } finally {
    busy = false;
    const b = $("#check"); if (b) { b.disabled = false; b.textContent = "Check answers"; }
  }
}

function S(s){
  return String(s ?? "").replace(/[\u2018\u2019]/g,"'").replace(/[\u201C\u201D]/g,'"').replace(/[\u2013\u2014\u2212]/g,"-")
   .replace(/\u2026/g,"...").replace(/[\u2192\u21D2]/g,"->").replace(/[\u2022]/g,"-").replace(/[^\x09\x0A\x0D\x20-\x7E\xA0-\xFF]/g,"");
}

function evalText(x){
  if (!x) return "Not checked yet";
  let s = VL[x.verdict];
  if (x.feedback) s += "\n" + x.feedback;
  if (x.right.length) s += "\n\nWhat you got right:\n" + x.right.map(v => "+ " + v).join("\n");
  if (x.wrong.length) s += "\n\nWhat to rethink:\n" + x.wrong.map(v => "- " + v).join("\n");
  if (x.hints.length) s += "\n\nWhat might be missing:\n" + x.hints.map(v => "? " + v).join("\n");
  return S(s);
}

async function makePdf(){
  const u = UC[state.active], t = tab();
  if (!window.jspdf || !window.jspdf.jsPDF) { setStatus("The PDF tools didn't load. Reload the page and try again.", {err:true}); return; }
  const doc = new window.jspdf.jsPDF({unit:"pt", format:"a4", orientation:"landscape"});
  if (typeof doc.autoTable !== "function") { setStatus("The PDF tools didn't load. Reload the page and try again.", {err:true}); return; }
  const W = doc.internal.pageSize.getWidth(), H = doc.internal.pageSize.getHeight(), M = 40, TW = W - 2*M;
  let y = M + 6;
  const para = (txt, size=10, style="normal", color=[33,31,29], gap=4) => {
    doc.setFont("helvetica", style); doc.setFontSize(size); doc.setTextColor(color[0],color[1],color[2]);
    const lines = doc.splitTextToSize(S(txt), TW);
    lines.forEach(l => { if (y > H - M) { doc.addPage(); y = M; } doc.text(l, M, y); y += size * 1.35; });
    y += gap;
  };
  para(`Use case ${u.n}: ${u.title}`, 18, "bold", [33,31,29], 2);
  const members = t.members.split(/\n|,/).map(s => s.trim()).filter(Boolean).join(", ");
  para(`SIPOC worksheet   |   Team: ${t.team.trim() || "-"}   |   ${new Date().toLocaleDateString("en-GB",{day:"numeric",month:"long",year:"numeric"})}`, 10, "normal", [108,103,95], 0);
  para(`Team members: ${members || "-"}`, 10, "normal", [108,103,95], 10);
  para("The problem", 12, "bold", [182,29,34], 0);
  para(u.summary, 10, "normal", [33,31,29], 6);
  para("Agents involved", 12, "bold", [182,29,34], 0);
  u.agents.forEach(a => para(`- ${a[0]}: ${a[1]}`, 10, "normal", [33,31,29], 0));
  y += 6;
  para("What you will build afterwards", 12, "bold", [182,29,34], 0);
  para(u.build, 10, "normal", [33,31,29], 6);
  para(`Scope: ${u.scope}`, 10, "italic", [33,31,29], 4);

  const r = t.result;
  const fills = {correct:[232,241,234], partial:[248,239,223], incorrect:[248,234,233], blank:[239,237,231]};
  doc.autoTable({
    startY: y + 4, margin:{left:M, right:M, top:M, bottom:M+10},
    head:[["SIPOC element","Team answer","Evaluation"]],
    body: ELS.map(E => [E.name, S((t.ans[E.k] || "").trim() || "(blank)"), evalText(r && r.elements[E.k])]),
    styles:{font:"helvetica", fontSize:9, cellPadding:7, valign:"top", lineColor:[214,207,194], lineWidth:0.5, textColor:[33,31,29]},
    headStyles:{fillColor:[182,29,34], textColor:255, fontStyle:"bold"},
    columnStyles:{0:{cellWidth:92, fontStyle:"bold"}, 1:{cellWidth:(TW-92)/2}},
    didParseCell: d => { if (d.section === "body" && d.column.index === 2 && r) { const v = r.elements[ELS[d.row.index].k].verdict; d.cell.styles.fillColor = fills[v]; } }
  });
  y = doc.lastAutoTable.finalY + 22;
  if (r) {
    if (y > H - 110) { doc.addPage(); y = M + 6; }
    para(`Overall score: ${r.score} / 100`, 14, "bold", [182,29,34], 0);
    if (t.checkedHash !== hash(t)) para("Note: some answers were changed after this check.", 9, "italic", [166,106,22], 0);
    para(r.summary, 10, "normal", [33,31,29], 8);
  } else {
    para("These answers have not been checked yet.", 10, "italic", [108,103,95], 8);
  }
  para("Next step: use this SIPOC as the blueprint for building your agents with vibe coding.", 10, "bold", [33,31,29], 0);
  const pages = doc.internal.getNumberOfPages();
  for (let i = 1; i <= pages; i++) {
    doc.setPage(i); doc.setFont("helvetica","normal"); doc.setFontSize(8); doc.setTextColor(120);
    doc.text(S(`SIPOC Workbench  |  Use case ${u.n}  |  Page ${i} of ${pages}`), M, H - 20);
  }
  const slug = (t.team.trim() || "team").replace(/[^A-Za-z0-9]+/g,"-").replace(/^-|-$/g,"").slice(0,40) || "team";
  const filename = `SIPOC-UC${u.n}-${slug}.pdf`;
  const blob = doc.output("blob");
  const dl = await downloadsP;
  if (dl) {
    try { await dl.save({filename, data:blob}); setStatus("PDF saved. Print it and bring it to your build session."); }
    catch(e) { setStatus(e && e.code === "declined" ? "Download cancelled." : "The PDF couldn't be saved here. Try again in a moment.", {err: !(e && e.code === "declined")}); }
  } else {
    try { doc.save(filename); setStatus("PDF downloaded."); } catch(e) { setStatus("The PDF couldn't be saved here.", {err:true}); }
  }
}

renderTabs();
renderPanel();
</script>
